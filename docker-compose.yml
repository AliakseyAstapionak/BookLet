services:
  db:
    image: postgres:15-alpine
    container_name: booklet_db
    ports: 
      - "127.0.0.1:5435:5432"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_USER: ${DB_USER}
    volumes:
      - booklet_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 5s

  backend:
    build: .
    container_name: booklet_app
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_HOST: 'redis'
      REDIS_PORT: '6379'
    depends_on:
      db:
        condition: service_healthy

  redis:
    image: redis:alpine
    container_name: booklet_redis
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  booklet_pgdata: